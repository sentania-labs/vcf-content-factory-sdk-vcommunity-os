# resources.properties — display strings for VCF Content Factory vCommunity OS.
# Keys are the integer nameKey values referenced in describe.xml.
# <N>.description entries supply the field's (i) help text, with wording
# mirrored verbatim from the prod original (vmbro app/adapter.py).

# Adapter Kind / solution display name
1=VCF Content Factory vCommunity OS

# vCenter Credential (single combined kind: vCenter session + Windows guest)
2=vCenter Credential
3=vCenter User Name
4=vCenter Password
40=Windows User Name
41=Windows Password

# Adapter Instance — basic settings
5=VCF Content Factory vCommunity OS
6=vCenter Server
6.description=FQDN or IP address of the vCenter Server instance (guest-ops runs through this vCenter's GuestOperationsManager).

# Adapter Instance — advanced settings
14=Port
14.description=Enter the port number for vCenter Server.
12=Windows Service Configuration File
12.description=Enter the configuration file name that contains Windows Service Names.
13=Windows Event Log Configuration File
13.description=Enter the configuration file name that contains Windows Event Log IDs.
7=Guest OS Service Monitoring Status
7.description=Choose Enabled to enable Guest OS Service Monitoring.
16=Windows Event Log Monitoring Status
16.description=Choose Enabled to activate Windows Event Log Monitoring.
15=Allow Insecure SSL
15.description=Set to true to disable vCenter SOAP TLS certificate validation (lab opt-out). Leave false in production.

# vCommunityWorld
20=vCommunity World
21=World ID
22=Summary
25=VMs Stitched
26=Guest VMs Attempted
27=Guest VMs Degraded
28=Events As Properties
29=Last Scan Timestamp
30=Config File Status
31=Status
